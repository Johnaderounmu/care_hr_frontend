name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Create production .env file
        run: |
          echo "API_BASE_URL=https://care-hr-backend.onrender.com" > .env
          echo "GRAPHQL_ENDPOINT=https://care-hr-backend.onrender.com/graphql" >> .env
          echo "WEBSOCKET_URL=wss://care-hr-backend.onrender.com/ws" >> .env
          echo "ENCRYPTION_KEY=web_production_key_32_chars_len" >> .env
          echo "JWT_SECRET_KEY=web_production_jwt_256_bits_key" >> .env
          echo "API_KEY=web_production_api_key_secure" >> .env
          echo "CACHE_ENABLED=true" >> .env
          echo "PERFORMANCE_MONITORING=true" >> .env
          echo "COMPRESSION_ENABLED=true" >> .env
          echo "ANALYTICS_ENABLED=true" >> .env
          echo "PUSH_NOTIFICATIONS=true" >> .env
          echo "OFFLINE_MODE=true" >> .env
          echo "DEMO_MODE=false" >> .env
          
      - name: Enable Flutter web support
        run: flutter config --enable-web
          
      - name: Get dependencies
        run: flutter pub get
        
      - name: Generate code
        run: flutter packages pub run build_runner build --delete-conflicting-outputs
        
      - name: Clean previous builds
        run: flutter clean
        
      - name: Build Flutter Web
        run: |
          flutter build web \
            --release \
            --web-renderer canvaskit \
            --base-href /care_hr_frontend/ \
            --dart-define=FLUTTER_WEB_USE_SKIA=true \
            --dart-define=FLUTTER_WEB_AUTO_DETECT=true \
            --dart-define=FLUTTER_WEB_CANVASKIT_URL=https://unpkg.com/canvaskit-wasm@0.32.0/bin/
        
      - name: Add custom web configuration
        run: |
          # Add custom index.html modifications for production
          if [ -f "build/web/index.html" ]; then
            sed -i 's/<title>care_hr_app<\/title>/<title>Care HR - Enterprise HR Management System<\/title>/g' build/web/index.html
            
            # Add meta tags for better SEO
            sed -i '/<meta name="description"/d' build/web/index.html
            sed -i '/<\/head>/i\  <meta name="description" content="Enterprise HR Management System - Streamline your HR processes with our comprehensive solution.">' build/web/index.html
            sed -i '/<\/head>/i\  <meta name="keywords" content="HR, Human Resources, Management, Enterprise, Flutter, Web App">' build/web/index.html
            sed -i '/<\/head>/i\  <meta name="author" content="Care HR Team">' build/web/index.html
            sed -i '/<\/head>/i\  <meta name="viewport" content="width=device-width, initial-scale=1.0">' build/web/index.html
            
            echo "✅ HTML modifications completed"
          else
            echo "❌ build/web/index.html not found"
            exit 1
          fi
          
          # Create comprehensive PWA manifest
          cat > build/web/manifest.json << 'EOF'
          {
            "name": "Care HR - Enterprise HR Management System",
            "short_name": "Care HR",
            "description": "Enterprise HR Management System - Streamline your HR processes",
            "start_url": "/care_hr_frontend/",
            "display": "standalone",
            "orientation": "portrait-primary",
            "background_color": "#ffffff",
            "theme_color": "#2196F3",
            "categories": ["business", "productivity"],
            "lang": "en-US",
            "icons": [
              {
                "src": "icons/Icon-192.png",
                "sizes": "192x192",
                "type": "image/png",
                "purpose": "maskable any"
              },
              {
                "src": "icons/Icon-512.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "maskable any"
              }
            ]
          }
          EOF
          
          echo "✅ PWA manifest created successfully"
          
      - name: Verify build output
        run: |
          if [ -d "build/web" ]; then
            echo "📁 Build directory structure:"
            ls -la build/web/
            echo ""
            echo "📄 Key files check:"
            [ -f "build/web/index.html" ] && echo "✅ index.html exists" || echo "❌ index.html missing"
            [ -f "build/web/manifest.json" ] && echo "✅ manifest.json exists" || echo "❌ manifest.json missing"
            [ -f "build/web/main.dart.js" ] && echo "✅ main.dart.js exists" || echo "❌ main.dart.js missing"
            echo ""
            echo "📊 Build size:"
            du -sh build/web/
          else
            echo "❌ Build directory not found!"
            exit 1
          fi
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build/web'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
      - name: Verify deployment
        run: |
          echo "🚀 Deployment completed!"
          echo "📍 Deployment URL: ${{ steps.deployment.outputs.page_url }}"
          echo "⏰ Deployment time: $(date)"
          
          # Optional: Basic health check (uncomment if you want to test the deployed URL)
          # sleep 30
          # curl -f "${{ steps.deployment.outputs.page_url }}" > /dev/null && echo "✅ Site is accessible" || echo "⚠️ Site check failed"