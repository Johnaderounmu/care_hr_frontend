name: Flutter iOS Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build_ios:
    name: Build Flutter iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true
          
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'
        
      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -v 1.15.2
          pod --version

      - name: Create .env file
        run: |
          echo "API_BASE_URL=http://localhost:4000" > .env
          echo "GRAPHQL_ENDPOINT=http://localhost:4000/graphql" >> .env
          echo "WEBSOCKET_URL=ws://localhost:4000/ws" >> .env
          echo "ENCRYPTION_KEY=test_key_for_ci" >> .env
          echo "JWT_SECRET_KEY=test_jwt_secret_for_ci" >> .env
          echo "API_KEY=test_api_key_for_ci" >> .env
          
      - name: Get dependencies
        run: flutter pub get
        
      - name: Generate code
        run: flutter packages pub run build_runner build --delete-conflicting-outputs
        
      - name: Clean iOS build
        run: flutter clean && cd ios && rm -rf Pods Podfile.lock && cd ..
        
      - name: Install CocoaPods dependencies
        run: cd ios && pod install && cd ..
        
      - name: Build iOS app
        run: flutter build ios --release --no-codesign
        
      - name: Archive iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.app
