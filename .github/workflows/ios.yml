name: Flutter iOS Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build_ios:
    name: Build Flutter iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.37.0-0.1.pre'
          channel: 'beta'
          cache: true
          
      - name: Create .env file
        run: |
          echo "FIREBASE_API_KEY=dummy_key_for_ci" > .env
          echo "FIREBASE_PROJECT_ID=dummy_project_for_ci" >> .env
          
      - name: Get dependencies
        run: flutter pub get
        
      - name: Generate code
        run: flutter packages pub run build_runner build --delete-conflicting-outputs
        
      - name: Build iOS app
        run: flutter build ios --release --no-codesign --no-sound-null-safety
        
      - name: Archive iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-standalone
          path: build/ios/iphoneos/Runner.app
