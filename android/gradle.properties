org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.desktop/java.awt.font=ALL-UNNAMED --add-opens=java.base/java.lang.ref=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED

android.useAndroidX=true
android.enableJetifier=true

# Set Java 17 for Android Gradle Plugin compatibility (Required for AGP 8.0+)
org.gradle.java.home=/Library/Java/JavaVirtualMachines/openjdk-17.jdk/Contents/Home
# Temporarily disable configuration cache to avoid reflection issues
org.gradle.configuration-cache=false
# Suppress compileSdk warning for newer API level
android.suppressUnsupportedCompileSdk=36
